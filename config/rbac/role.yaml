---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - databases.mini-everest.io
  resources:
  - databaseclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - databases.mini-everest.io
  resources:
  - databaseclusters/finalizers
  verbs:
  - update
- apiGroups:
  - databases.mini-everest.io
  resources:
  - databaseclusters/status
  verbs:
  - get
  - patch
  - update
